<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Donor Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🩸 Blood Donor Management System</h1>
        <p>Register as a donor and help save lives.</p>
    </header>

    <main>
        <!-- Dashboard -->
<!-- Dashboard -->
<section class="dashboard">

    <div class="dashboard-card">
        <h3>Total Donors</h3>
        <p id="totalDonors">0</p>
    </div>

    <div class="dashboard-card">
        <h3>A+</h3>
        <p id="countAPlus">0</p>
    </div>

    <div class="dashboard-card">
        <h3>B+</h3>
        <p id="countBPlus">0</p>
    </div>

    <div class="dashboard-card">
        <h3>O+</h3>
        <p id="countOPlus">0</p>
    </div>

    <div class="dashboard-card">
        <h3>AB+</h3>
        <p id="countABPlus">0</p>
    </div>

    <div class="dashboard-card">
    <h3>A-</h3>
    <p id="countAMinus">0</p>
</div>

<div class="dashboard-card">
    <h3>B-</h3>
    <p id="countBMinus">0</p>
</div>

<div class="dashboard-card">
    <h3>O-</h3>
    <p id="countOMinus">0</p>
</div>

<div class="dashboard-card">
    <h3>AB-</h3>
    <p id="countABMinus">0</p>
</div>

</section>

        <section class="form-container">

            <h2>Donor Registration</h2>

            <form id="donorForm">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="bloodGroup">Blood Group</label>

                    <select id="bloodGroup" required>
                        <option value="">Select blood group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input
                        type="number"
                        id="age"
                        placeholder="Enter your age"
                        min="18"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>

                    <select id="gender" required>
                        <option value="">Select gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter 10-digit phone number"
                        maxlength="10"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input
                        type="text"
                        id="city"
                        placeholder="Enter your city"
                        required
                    >
                </div>

                <button type="submit">Register Donor</button>

                <p id="message"></p>

            </form>

        </section>

        <!-- Blood Request -->
<section class="request-container">

    <h2>Blood Request</h2>

    <form id="requestForm">

        <div class="form-group">
            <label for="patientName">Patient Name</label>
            <input
                type="text"
                id="patientName"
                placeholder="Enter patient name"
                required>
        </div>

        <div class="form-group">
            <label for="requestBloodGroup">Blood Group</label>
            <select id="requestBloodGroup" required>
                <option value="">Select blood group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>
        </div>

        <div class="form-group">
            <label for="units">Blood Units Required</label>
            <input
                type="number"
                id="units"
                min="1"
                placeholder="Enter required units"
                required>
        </div>

        <div class="form-group">
            <label for="hospitalName">Hospital Name</label>
            <input
                type="text"
                id="hospitalName"
                placeholder="Enter hospital name"
                required>
        </div>

        <div class="form-group">
            <label for="requestCity">City</label>
            <input
                type="text"
                id="requestCity"
                placeholder="Enter city"
                required>
        </div>

        <div class="form-group">
            <label for="contactNumber">Contact Number</label>
            <input
                type="text"
                id="contactNumber"
                placeholder="Enter contact number"
                required>
        </div>

        <button type="submit">Submit Blood Request</button>

        <p id="requestMessage"></p>

    </form>

</section>

<section class="request-list-container">
    <h2>Blood Requests</h2>
    <div id="requestList"></div>
</section>

        <section class="search-container">
<h2>Search Donors</h2>

<div class="search-group">

    <div class="form-group">
        <label for="searchBloodGroup">Blood Group</label>

        <select id="searchBloodGroup">
            <option value="">All Blood Groups</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>
    </div>

    <div class="form-group">
        <label for="searchCity">City</label>

        <input
            type="text"
            id="searchCity"
            placeholder="Enter city"
        >
    </div>

</div>

<button type="button" id="searchButton">
    Search Donors
</button>

<div id="donorList"></div>

    </section>
    <!-- Edit Donor Modal -->
<div id="editModal" class="modal">

    <div class="modal-content">

        <span class="close" onclick="closeEditModal()">&times;</span>

        <h2>Edit Donor</h2>

        <form id="editForm">

            <input type="hidden" id="editId">

            <label>Full Name</label>
            <input type="text" id="editName" required>

            <label>Blood Group</label>
            <select id="editBloodGroup" required>
                <option value="">Select blood group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>

            <label>Age</label>
            <input type="number" id="editAge" min="18" required>

            <label>Gender</label>
            <select id="editGender" required>
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label>Phone Number</label>
            <input type="text" id="editPhone" required>

            <label>City</label>
            <input type="text" id="editCity" required>

            <div class="modal-buttons">
                <button type="button" onclick="closeEditModal()">Cancel</button>
                <button type="submit">Update Donor</button>
            </div>

        </form>

    </div>

</div>

    </main>

    <script src="script.js"></script>

</body>
</html>
